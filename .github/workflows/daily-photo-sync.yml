name: Automated Scheduled Google Photos Sync

on:
  schedule:
    # Runs twice every day at 04:00 and 16:00 UTC (every 12 hours)
    - cron: '0 4,16 * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub web interface

jobs:
  sync-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Google Photos Sync Engine
        run: npx tsx scripts/sync-photos.ts "https://photos.app.goo.gl/rPu6ZCJtajQt4kYu6" user_google_account
